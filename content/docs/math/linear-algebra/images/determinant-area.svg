<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#EF4444"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9CA3AF"/>
    </marker>
  </defs>

  <!-- === Left: Unit square before transformation === -->
  <g>
    <text x="30" y="30" fill="#111827" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Before</text>

    <!-- Grid -->
    <g stroke="#E5E7EB" stroke-width="0.5">
      <line x1="30" y1="55" x2="30" y2="310"/>
      <line x1="80" y1="55" x2="80" y2="310"/>
      <line x1="130" y1="55" x2="130" y2="310"/>
      <line x1="180" y1="55" x2="180" y2="310"/>
      <line x1="230" y1="55" x2="230" y2="310"/>
      <line x1="30" y1="270" x2="230" y2="270"/>
      <line x1="30" y1="220" x2="230" y2="220"/>
      <line x1="30" y1="170" x2="230" y2="170"/>
      <line x1="30" y1="120" x2="230" y2="120"/>
      <line x1="30" y1="70" x2="230" y2="70"/>
      <line x1="30" y1="55" x2="230" y2="55"/>
    </g>

    <!-- Axes -->
    <line x1="30" y1="170" x2="235" y2="170" stroke="#9CA3AF" stroke-width="1" marker-end="url(#arrow-gray)"/>
    <line x1="100" y1="310" x2="100" y2="50" stroke="#9CA3AF" stroke-width="1" marker-end="url(#arrow-gray)"/>

    <!-- Unit square -->
    <rect x="100" y="170" width="60" height="60" fill="#3B82F6" opacity="0.15" stroke="#3B82F6" stroke-width="2"/>

    <!-- î -->
    <line x1="100" y1="170" x2="160" y2="170" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <text x="120" y="163" fill="#3B82F6" font-family="Arial, sans-serif" font-size="13" font-style="italic">î</text>

    <!-- ĵ -->
    <line x1="100" y1="170" x2="100" y2="110" stroke="#EF4444" stroke-width="2.5" marker-end="url(#arrow-red)"/>
    <text x="105" y="105" fill="#EF4444" font-family="Arial, sans-serif" font-size="13" font-style="italic">ĵ</text>

    <!-- Area label -->
    <text x="115" y="205" fill="#111827" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Area = 1</text>
  </g>

  <!-- Arrow between panels -->
  <text x="260" y="180" fill="#111827" font-family="Arial, sans-serif" font-size="20">→</text>

  <!-- === Right: After transformation (shear) === -->
  <g>
    <text x="320" y="30" fill="#111827" font-family="Arial, sans-serif" font-size="14" font-weight="bold">After (det = 1)</text>

    <!-- Grid - sheared -->
    <g stroke="#E5E7EB" stroke-width="0.5">
      <line x1="290" y1="55" x2="690" y2="55"/>
      <line x1="290" y1="105" x2="690" y2="105"/>
      <line x1="290" y1="155" x2="690" y2="155"/>
      <line x1="290" y1="205" x2="690" y2="205"/>
      <line x1="290" y1="255" x2="690" y2="255"/>
      <line x1="290" y1="305" x2="690" y2="305"/>
      <!-- Skewed vertical lines -->
      <line x1="320" y1="55" x2="370" y2="310"/>
      <line x1="380" y1="55" x2="430" y2="310"/>
      <line x1="440" y1="55" x2="490" y2="310"/>
      <line x1="500" y1="55" x2="550" y2="310"/>
      <line x1="560" y1="55" x2="610" y2="310"/>
      <line x1="620" y1="55" x2="670" y2="310"/>
    </g>

    <!-- Axes -->
    <line x1="320" y1="170" x2="660" y2="170" stroke="#9CA3AF" stroke-width="1" marker-end="url(#arrow-gray)"/>
    <line x1="380" y1="310" x2="380" y2="50" stroke="#9CA3AF" stroke-width="1" marker-end="url(#arrow-gray)"/>

    <!-- Transformed unit square (parallelogram) -->
    <polygon points="380,170 470,170 500,110 410,110" fill="#3B82F6" opacity="0.15" stroke="#3B82F6" stroke-width="2"/>

    <!-- î stays same -->
    <line x1="380" y1="170" x2="470" y2="170" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <text x="415" y="163" fill="#3B82F6" font-family="Arial, sans-serif" font-size="13" font-style="italic">î</text>

    <!-- ĵ moves to (1,1) -->
    <line x1="380" y1="170" x2="410" y2="110" stroke="#EF4444" stroke-width="2.5" marker-end="url(#arrow-red)"/>
    <text x="415" y="105" fill="#EF4444" font-family="Arial, sans-serif" font-size="13" font-style="italic">ĵ</text>

    <!-- Height indicator -->
    <line x1="470" y1="170" x2="470" y2="110" stroke="#6B7280" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="478" y="145" fill="#6B7280" font-family="Arial, sans-serif" font-size="11">Height = 1</text>

    <!-- Area label -->
    <text x="420" y="205" fill="#111827" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Area = 1</text>
  </g>

  <!-- Caption -->
  <text x="300" y="335" fill="#6B7280" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">A shear preserves area: the unit square becomes a parallelogram with the same base and height.</text>
</svg>
