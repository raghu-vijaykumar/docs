<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#EF4444"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9CA3AF"/>
    </marker>
  </defs>

  <!-- === Left side: Full span (plane) === -->
  <g>
    <text x="30" y="30" fill="#111827" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Span = All of 2D Space</text>

    <!-- Grid -->
    <g stroke="#E5E7EB" stroke-width="0.5">
      <line x1="30" y1="55" x2="30" y2="345"/>
      <line x1="80" y1="55" x2="80" y2="345"/>
      <line x1="130" y1="55" x2="130" y2="345"/>
      <line x1="180" y1="55" x2="180" y2="345"/>
      <line x1="230" y1="55" x2="230" y2="345"/>
      <line x1="280" y1="55" x2="280" y2="345"/>
      <line x1="30" y1="300" x2="280" y2="300"/>
      <line x1="30" y1="250" x2="280" y2="250"/>
      <line x1="30" y1="200" x2="280" y2="200"/>
      <line x1="30" y1="150" x2="280" y2="150"/>
      <line x1="30" y1="100" x2="280" y2="100"/>
      <line x1="30" y1="55" x2="280" y2="55"/>
    </g>

    <!-- Axes -->
    <line x1="30" y1="200" x2="285" y2="200" stroke="#9CA3AF" stroke-width="1" marker-end="url(#arrow-gray)"/>
    <line x1="155" y1="345" x2="155" y2="50" stroke="#9CA3AF" stroke-width="1" marker-end="url(#arrow-gray)"/>

    <!-- Semi-transparent fill to show "all of 2D space" -->
    <rect x="30" y="55" width="250" height="290" fill="#3B82F6" opacity="0.06"/>

    <!-- v1 -->
    <line x1="155" y1="200" x2="230" y2="140" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <text x="230" y="135" fill="#3B82F6" font-family="Arial, sans-serif" font-size="13" font-style="italic">v₁</text>

    <!-- v2 -->
    <line x1="155" y1="200" x2="100" y2="130" stroke="#EF4444" stroke-width="2.5" marker-end="url(#arrow-red)"/>
    <text x="60" y="125" fill="#EF4444" font-family="Arial, sans-serif" font-size="13" font-style="italic">v₂</text>

    <!-- Example reachable points -->
    <circle cx="230" cy="140" r="2.5" fill="#3B82F6"/>
    <circle cx="100" cy="130" r="2.5" fill="#EF4444"/>
    <circle cx="192" cy="170" r="2.5" fill="#6B7280"/>
    <circle cx="138" cy="155" r="2.5" fill="#6B7280"/>
    <circle cx="80" cy="200" r="2.5" fill="#6B7280"/>
    <circle cx="250" cy="100" r="2.5" fill="#6B7280"/>
  </g>

  <!-- === Divider === -->
  <line x1="295" y1="40" x2="295" y2="350" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- === Right side: Line span === -->
  <g>
    <text x="315" y="30" fill="#111827" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Span = A Single Line</text>

    <!-- Grid -->
    <g stroke="#E5E7EB" stroke-width="0.5">
      <line x1="315" y1="55" x2="315" y2="345"/>
      <line x1="365" y1="55" x2="365" y2="345"/>
      <line x1="415" y1="55" x2="415" y2="345"/>
      <line x1="465" y1="55" x2="465" y2="345"/>
      <line x1="515" y1="55" x2="515" y2="345"/>
      <line x1="565" y1="55" x2="565" y2="345"/>
      <line x1="315" y1="300" x2="565" y2="300"/>
      <line x1="315" y1="250" x2="565" y2="250"/>
      <line x1="315" y1="200" x2="565" y2="200"/>
      <line x1="315" y1="150" x2="565" y2="150"/>
      <line x1="315" y1="100" x2="565" y2="100"/>
      <line x1="315" y1="55" x2="565" y2="55"/>
    </g>

    <!-- Axes -->
    <line x1="315" y1="200" x2="570" y2="200" stroke="#9CA3AF" stroke-width="1" marker-end="url(#arrow-gray)"/>
    <line x1="440" y1="345" x2="440" y2="50" stroke="#9CA3AF" stroke-width="1" marker-end="url(#arrow-gray)"/>

    <!-- The line showing the span -->
    <line x1="250" y1="310" x2="630" y2="90" stroke="#3B82F6" stroke-width="2" opacity="0.5"/>

    <!-- v1 -->
    <line x1="440" y1="200" x2="510" y2="135" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <text x="510" y="130" fill="#3B82F6" font-family="Arial, sans-serif" font-size="13" font-style="italic">v₁</text>

    <!-- v2 (collinear with v1) -->
    <line x1="440" y1="200" x2="395" y2="245" stroke="#EF4444" stroke-width="2.5" marker-end="url(#arrow-red)"/>
    <text x="365" y="255" fill="#EF4444" font-family="Arial, sans-serif" font-size="13" font-style="italic">v₂</text>

    <!-- Points on the line -->
    <circle cx="510" cy="135" r="2.5" fill="#3B82F6"/>
    <circle cx="395" cy="245" r="2.5" fill="#EF4444"/>
    <circle cx="460" cy="200" r="2.5" fill="#6B7280"/>
    <circle cx="370" cy="275" r="2.5" fill="#6B7280"/>
    <circle cx="540" cy="110" r="2.5" fill="#6B7280"/>

    <!-- No points off the line -->
    <text x="350" y="330" fill="#EF4444" font-family="Arial, sans-serif" font-size="11" font-style="italic">No points here!</text>
    <text x="350" y="345" fill="#EF4444" font-family="Arial, sans-serif" font-size="11" font-style="italic">(off the line)</text>
  </g>

  <!-- Caption -->
  <text x="300" y="370" fill="#6B7280" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">When vectors are not collinear, their span is the whole plane. When they line up, the span collapses to a line.</text>
</svg>
