<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#EF4444"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9CA3AF"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F59E0B"/>
    </marker>
  </defs>

  <!-- === Left side: Standard basis === -->
  <g>
    <text x="30" y="30" fill="#111827" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Standard Basis (î, ĵ)</text>

    <!-- Grid -->
    <g stroke="#E5E7EB" stroke-width="0.5">
      <line x1="30" y1="55" x2="30" y2="345"/>
      <line x1="80" y1="55" x2="80" y2="345"/>
      <line x1="130" y1="55" x2="130" y2="345"/>
      <line x1="180" y1="55" x2="180" y2="345"/>
      <line x1="230" y1="55" x2="230" y2="345"/>
      <line x1="280" y1="55" x2="280" y2="345"/>
      <line x1="30" y1="300" x2="280" y2="300"/>
      <line x1="30" y1="250" x2="280" y2="250"/>
      <line x1="30" y1="200" x2="280" y2="200"/>
      <line x1="30" y1="150" x2="280" y2="150"/>
      <line x1="30" y1="100" x2="280" y2="100"/>
      <line x1="30" y1="55" x2="280" y2="55"/>
    </g>

    <!-- Axes -->
    <line x1="30" y1="200" x2="285" y2="200" stroke="#9CA3AF" stroke-width="1" marker-end="url(#arrow-gray)"/>
    <line x1="155" y1="345" x2="155" y2="50" stroke="#9CA3AF" stroke-width="1" marker-end="url(#arrow-gray)"/>

    <!-- î -->
    <line x1="155" y1="200" x2="230" y2="200" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <text x="185" y="193" fill="#3B82F6" font-family="Arial, sans-serif" font-size="13" font-style="italic">î</text>

    <!-- ĵ -->
    <line x1="155" y1="200" x2="155" y2="130" stroke="#EF4444" stroke-width="2.5" marker-end="url(#arrow-red)"/>
    <text x="160" y="125" fill="#EF4444" font-family="Arial, sans-serif" font-size="13" font-style="italic">ĵ</text>

    <!-- Point (2, 1) in standard basis -->
    <circle cx="230" cy="130" r="4" fill="#111827"/>
    <text x="235" y="125" fill="#111827" font-family="Arial, sans-serif" font-size="12">(2, 1)</text>
    <line x1="155" y1="200" x2="230" y2="130" stroke="#111827" stroke-width="1" stroke-dasharray="4,2"/>
  </g>

  <!-- === Divider === -->
  <line x1="295" y1="40" x2="295" y2="350" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- === Right side: Alternative basis === -->
  <g>
    <text x="315" y="30" fill="#111827" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Alternative Basis (v₁, v₂)</text>

    <!-- Grid using alternative basis -->
    <g stroke="#E5E7EB" stroke-width="0.5">
      <line x1="315" y1="55" x2="315" y2="345"/>
      <line x1="365" y1="55" x2="365" y2="345"/>
      <line x1="415" y1="55" x2="415" y2="345"/>
      <line x1="465" y1="55" x2="465" y2="345"/>
      <line x1="515" y1="55" x2="515" y2="345"/>
      <line x1="565" y1="55" x2="565" y2="345"/>
      <line x1="315" y1="300" x2="565" y2="300"/>
      <line x1="315" y1="250" x2="565" y2="250"/>
      <line x1="315" y1="200" x2="565" y2="200"/>
      <line x1="315" y1="150" x2="565" y2="150"/>
      <line x1="315" y1="100" x2="565" y2="100"/>
      <line x1="315" y1="55" x2="565" y2="55"/>
    </g>

    <!-- Skewed grid lines for alternative basis -->
    <g stroke="#E5E7EB" stroke-width="0.5">
      <!-- Diagonal lines following v1 direction -->
      <line x1="315" y1="300" x2="365" y2="345"/>
      <line x1="365" y1="250" x2="415" y2="300"/>
      <line x1="415" y1="200" x2="465" y2="250"/>
      <line x1="465" y1="150" x2="515" y2="200"/>
      <line x1="515" y1="100" x2="565" y2="150"/>
      <line x1="315" y1="100" x2="365" y2="150"/>
      <line x1="365" y1="55" x2="415" y2="100"/>
      <!-- Diagonal lines following v2 direction -->
      <line x1="465" y1="55" x2="415" y2="100"/>
      <line x1="515" y1="55" x2="465" y2="100"/>
      <line x1="565" y1="55" x2="515" y2="100"/>
      <line x1="415" y1="300" x2="365" y2="345"/>
      <line x1="465" y1="250" x2="415" y2="300"/>
      <line x1="515" y1="200" x2="465" y2="250"/>
      <line x1="565" y1="150" x2="515" y2="200"/>
    </g>

    <!-- Axes -->
    <line x1="315" y1="200" x2="570" y2="200" stroke="#9CA3AF" stroke-width="1" marker-end="url(#arrow-gray)"/>
    <line x1="440" y1="345" x2="440" y2="50" stroke="#9CA3AF" stroke-width="1" marker-end="url(#arrow-gray)"/>

    <!-- v₁ (pointing right and up) -->
    <line x1="440" y1="200" x2="515" y2="130" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
    <text x="505" y="125" fill="#8B5CF6" font-family="Arial, sans-serif" font-size="13" font-style="italic">v₁</text>

    <!-- v₂ (pointing right and down) -->
    <line x1="440" y1="200" x2="500" y2="270" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
    <text x="500" y="280" fill="#F59E0B" font-family="Arial, sans-serif" font-size="13" font-style="italic">v₂</text>

    <!-- Same point (2, 1) in standard basis, now expressed in alternative basis -->
    <circle cx="230" cy="130" r="4" fill="#111827"/>
    <text x="237" y="105" fill="#111827" font-family="Arial, sans-serif" font-size="11">Same point</text>
    <text x="237" y="118" fill="#111827" font-family="Arial, sans-serif" font-size="11">different coords</text>
  </g>

  <!-- Caption -->
  <text x="180" y="370" fill="#6B7280" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">The same geometric point has different coordinates in different bases.</text>
</svg>
