{{ if not (.Page.Scratch.Get "markmap") }}
<!-- Include markmap only first time -->
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-view"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-lib"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-autoloader"></script>
{{ .Page.Scratch.Set "markmap" true }}
{{ end }}

<div id="markmap-{{ .Get "id" | default "default" }}" class="markmap-container"></div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const container = document.getElementById('markmap-{{ .Get "id" | default "default" }}');
    const content = `{{ .Inner }}`.trim();
    
    if (container && window.markmap) {
      const { Transformer } = window.markmap;
      const transformer = new Transformer();
      const { root } = transformer.transform(content);
      
      const mm = window.markmap.Markmap.create(container, {
        initialExpandLevel: 2,
        zoom: true,
        pan: true,
        autoFit: true
      }, root);

      // Center and fit view after creation
      setTimeout(() => {
        mm.fit();
        const svg = container.querySelector('svg');
        if (svg) {
          svg.style.width = '100%';
          svg.style.height = '100%';
        }
      }, 100);
    } else {
      console.error('Container or markmap not found');
    }
  });
</script>

<style>
  .markmap-container {
    width: 100%;
    height: 500px;
    border: 1px solid #ddd;
    margin: 1rem 0;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  
  .markmap-container > svg {
    max-width: 100%;
    max-height: 100%;
  }
</style>
